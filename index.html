<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Asset Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F9;
    --panel:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6572;
    --line:#DDE3EA;
    --steel:#3E5C76;
    --steel-dark:#2C4155;
    --teal:#2E8B8B;
    --teal-bg:#E4F3F1;
    --amber:#B8720A;
    --amber-bg:#FBF0DD;
    --coral:#C23B3B;
    --coral-bg:#FBE7E7;
    --slate-bg:#EEF1F5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}

  /* header */
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .brand-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--steel);text-transform:uppercase;margin:0 0 4px;}
  .brand-title{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .brand-sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .btn{
    border:none;border-radius:8px;padding:10px 16px;font-family:inherit;font-size:13.5px;font-weight:500;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--steel);color:#fff;}
  .btn-primary:hover{background:var(--steel-dark);}
  .btn-ghost{background:transparent;color:var(--steel);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--slate-bg);}
  .btn-danger{background:transparent;color:var(--coral);border:1px solid var(--coral-bg);}
  .btn-danger:hover{background:var(--coral-bg);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .stat-label{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace;}
  .stat-value{font-size:24px;font-weight:600;margin-top:4px;}
  .stat.warn .stat-value{color:var(--amber);}
  .stat.bad .stat-value{color:var(--coral);}

  /* filters */
  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filters input, .filters select{
    font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--panel);color:var(--ink);
  }
  .filters input{flex:1;min-width:180px;}
  .filters select{min-width:140px;}

  /* table */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);background:var(--slate-bg);padding:10px 14px;border-bottom:1px solid var(--line);
  }
  tbody tr{border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--slate-bg);}
  tbody td{padding:12px 14px;vertical-align:middle;}
  .asset-id{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .asset-name{font-weight:500;}
  .asset-type-badge{
    display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:20px;background:var(--slate-bg);color:var(--ink-soft);font-weight:500;
  }
  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 9px;border-radius:20px;}
  .status-pill::before{content:'';width:6px;height:6px;border-radius:50%;}
  .status-available{background:var(--teal-bg);color:var(--teal);}
  .status-available::before{background:var(--teal);}
  .status-inuse{background:#E5EBF2;color:var(--steel-dark);}
  .status-inuse::before{background:var(--steel);}
  .status-repair{background:var(--amber-bg);color:var(--amber);}
  .status-repair::before{background:var(--amber);}
  .status-retired{background:var(--coral-bg);color:var(--coral);}
  .status-retired::before{background:var(--coral);}

  /* warranty chip - signature element */
  .warranty-chip{display:flex;align-items:center;gap:8px;}
  .warranty-bar{width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative;}
  .warranty-bar-fill{height:100%;border-radius:3px;}
  .warranty-text{font-size:11.5px;font-family:'IBM Plex Mono',monospace;}
  .warranty-good .warranty-bar-fill{background:var(--teal);}
  .warranty-good .warranty-text{color:var(--teal);}
  .warranty-warn .warranty-bar-fill{background:var(--amber);}
  .warranty-warn .warranty-text{color:var(--amber);}
  .warranty-bad .warranty-bar-fill{background:var(--coral);}
  .warranty-bad .warranty-text{color:var(--coral);}

  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(27,36,48,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--panel);border-radius:14px;width:100%;max-width:560px;padding:26px 26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.2);}
  .modal h2{margin:0 0 4px;font-size:19px;}
  .modal .modal-sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:18px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  input, select, textarea{
    width:100%;font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:7px;padding:9px 10px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:56px;}
  .field{margin-bottom:4px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}

  /* photo capture */
  .photo-capture{
    border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:16px;background:var(--slate-bg);
  }
  .photo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .capture-status{font-size:12px;color:var(--ink-soft);}
  .capture-status.ok{color:var(--teal);}
  .capture-status.busy{color:var(--steel);}
  .capture-status.err{color:var(--coral);}
  #photoPreviewWrap{margin-top:10px;}
  .photo-thumb{max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--line);display:block;}
  .drawer-photo{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:6px;}
  .spinner{
    display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--steel);
    border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* detail drawer */
  .drawer-overlay{position:fixed;inset:0;background:rgba(27,36,48,.4);display:flex;justify-content:flex-end;z-index:40;}
  .drawer{background:var(--panel);width:100%;max-width:460px;height:100%;overflow-y:auto;padding:26px;box-shadow:-10px 0 40px rgba(0,0,0,.15);}
  .drawer-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .drawer-close{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;}
  .drawer-id{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
  .drawer-title{font-size:20px;font-weight:600;margin:0 0 14px;}
  .detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:500;text-align:right;}
  .section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);margin:22px 0 10px;}
  .action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .history-item{border-left:2px solid var(--line);padding:2px 0 12px 14px;position:relative;margin-left:2px;}
  .history-item::before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--steel);}
  .history-item .h-title{font-weight:500;font-size:13px;}
  .history-item .h-meta{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .history-item .h-note{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;}
  .toast.show{opacity:1;}

  .loading-note{color:var(--ink-soft);font-size:13px;padding:20px;}
  @media (max-width:640px){
    .stats{grid-template-columns:1fr 1fr;}
    .form-grid{grid-template-columns:1fr;}
    thead th:nth-child(4), tbody td:nth-child(4){display:none;}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  #authOverlay{position:fixed;inset:0;background:rgba(27,36,48,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;}
  #authCard{background:#fff;width:100%;max-width:390px;border-radius:14px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.28);}
  #authCard h2{margin:0 0 6px;font-size:21px;}
  #authCard p{margin:0 0 18px;color:#5B6572;font-size:13px;}
  #authError{display:none;color:#C23B3B;background:#FBE7E7;border-radius:8px;padding:9px 10px;font-size:12px;margin:10px 0;}
  #authLoading{display:none;color:#5B6572;font-size:12px;margin-top:8px;}
  #btnLogout{position:fixed;right:18px;bottom:18px;z-index:110;background:#fff;color:#C23B3B;border:1px solid #F0CACA;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:12px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.08);}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading-note">กำลังโหลดข้อมูล...</div>
</div>
<div class="toast" id="toast"></div>
<button id="btnLogout" onclick="logoutUser()">ออกจากระบบ</button>

<script>
/* QR Code Generator for JavaScript - Kazuhiko Arase - MIT License - embedded for offline/no-CDN use */
//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {

function showDialog({title, message, fields=[], datalists=[], confirmText='ตกลง', cancelText='ยกเลิก', onConfirm}){
  let host = document.getElementById('dialogHost');
  if(host) host.remove();
  const wrap = document.createElement('div');

  wrap.className = 'overlay';
  wrap.style.zIndex = '60';
  wrap.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <h2>${escapeHtml(title)}</h2>
      ${message?`<div class="modal-sub">${escapeHtml(message)}</div>`:''}
      ${fields.length ? `
        <div class="form-grid" style="grid-template-columns:1fr;">
          ${fields.map(f=>`
            <div class="field">
              <label>${escapeHtml(f.label)}</label>
              ${f.type==='select'
                ? `<select id="dlg_${f.id}">${(f.options||[]).map(o=>`<option value="${escapeAttr(o.value)}" ${o.value===f.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select>`
                : `<input id="dlg_${f.id}" type="text" value="${escapeAttr(f.value||'')}" placeholder="${escapeAttr(f.placeholder||'')}" ${f.list?`list="${f.list}"`:''}>`
              }
            </div>
          `).join('')}
        </div>
      ` : ''}
      ${datalists.map(d=>`<datalist id="${d.id}">${d.options.map(o=>`<option value="${escapeAttr(o)}">`).join('')}</datalist>`).join('')}
      <div class="modal-actions">
        <button class="btn btn-ghost" id="dlgCancel">${escapeHtml(cancelText)}</button>
        <button class="btn btn-primary" id="dlgConfirm">${escapeHtml(confirmText)}</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  document.getElementById('dlgCancel').onclick = ()=> wrap.remove();
  document.getElementById('dlgConfirm').onclick = ()=>{
    const values = {};
    fields.forEach(f=>{ const el = document.getElementById('dlg_'+f.id); values[f.id] = el ? el.value : ''; });
    wrap.remove();
    onConfirm(values);
  };
  setTimeout(()=>{
    const first = wrap.querySelector('input,select');
    if(first){ first.focus(); if(first.select) first.select(); }
  }, 30);
}

function warrantyInfo(expiry){
  if(!expiry) return {cls:'warranty-good', text:'ไม่ระบุ', pct:0};
  const days = daysBetween(todayStr(), expiry);
  if(days < 0) return {cls:'warranty-bad', text:'หมดประกันแล้ว', pct:100};
  if(days <= 30) return {cls:'warranty-warn', text:days + ' วัน', pct: Math.max(15,100-days*2)};
  return {cls:'warranty-good', text:days + ' วัน', pct: Math.min(90, 100-Math.min(days,365)/365*80)};
}

function getFilteredAssets(){
  return state.assets.filter(a=>{
    if(ui.typeFilter!=='all' && a.type!==ui.typeFilter) return false;
    if(ui.statusFilter!=='all' && a.status!==ui.statusFilter) return false;
    if(ui.search){
      const q = ui.search.toLowerCase();
      const hay = [a.id,a.name,a.model,a.serial,a.assignee,a.location].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'th'));
}

function computeStats(){
  const total = state.assets.length;
  const inuse = state.assets.filter(a=>a.status==='inuse').length;
  const expSoon = state.assets.filter(a=>{
    if(!a.warrantyExpiry) return false;
    const d = daysBetween(todayStr(), a.warrantyExpiry);
    return d>=0 && d<=30;
  }).length;
  const expired = state.assets.filter(a=> a.warrantyExpiry && daysBetween(todayStr(), a.warrantyExpiry) < 0).length;
  return {total, inuse, expSoon, expired};
}

function escapeHtml(s){

}

/* ---------- Photo capture + AI extraction ---------- */
function fileToCompressedBase64(file, maxDim=1000, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('โหลดรูปไม่สำเร็จ'));
      img.onload = ()=>{
        let {width, height} = img;
        if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function extractAssetInfoFromImage(base64Data){
  const prompt = 'นี่คือรูปถ่ายป้าย Serial Number หรือแผ่นป้ายข้อมูล (nameplate) ของอุปกรณ์ไอที เช่น คอมพิวเตอร์ เครื่องพิมพ์ เซิร์ฟเวอร์ หรือเครื่อง POS '
    + 'อ่านข้อมูลจากรูปแล้วตอบกลับเป็น JSON เท่านั้น ห้ามมีคำอธิบาย ห้ามมี Markdown code fence '
    + 'รูปแบบ JSON: {"serial":"","model":"","brand":"","type":"","rawText":""} '
    + 'โดย type ต้องเป็นค่าใดค่าหนึ่งใน computer, printer, server, pos หรือค่าว่างถ้าเดาไม่ได้ '
    + 'ถ้าอ่านค่าใดไม่ได้ให้ใส่เป็นสตริงว่าง';

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data: base64Data}},
          {type:'text', text: prompt}
        ]
      }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(c=>c.type==='text');
  if(!textBlock) throw new Error('ไม่ได้รับข้อความตอบกลับ');
  const clean = textBlock.text.replace(/```json|```/g,'').trim();
  return JSON.parse(clean);
}

function wirePhotoCapture(editing){

  const btnCapture = document.getElementById('btnCapture');

  } else if(editing && editing.photo){
    pendingPhotoData = editing.photo;
    photoPreviewWrap.innerHTML = `<img src="${editing.photo}" class="photo-thumb">`;
  }

  btnCapture.onclick = ()=> photoInput.click();
  photoInput.onchange = async (e)=>{
    const file = e.target.files[0];

      const base64Only = dataUrl.split(',')[1];
      const info = await extractAssetInfoFromImage(base64Only);
      let filledAny = false;
      if(info.serial){ document.getElementById('f_serial').value = info.serial; filledAny = true; }
      if(info.model){ document.getElementById('f_model').value = info.model; filledAny = true; }
      if(info.type && getAllTypes()[info.type]){ document.getElementById('f_type').value = info.type; }
      const nameEl = document.getElementById('f_name');
      if(!nameEl.value.trim() && (info.brand || info.model)){
        nameEl.value = [info.brand, info.model].filter(Boolean).join(' ');
        filledAny = true;
      }
      setCaptureStatus(captureStatus, filledAny ? '✓ อ่านข้อมูลสำเร็จ กรุณาตรวจสอบความถูกต้องก่อนบันทึก' : 'อ่านรูปได้ แต่ไม่พบ Serial Number ชัดเจน กรุณากรอกเอง', filledAny?'ok':'err');

    }
  };
}

/* ---------- Warranty auto-lookup ---------- */
async function lookupWarrantyExpiry({serial, model, brand}){
  const prompt = 'ช่วยค้นหาข้อมูลการรับประกัน (warranty) ของอุปกรณ์ไอทีชิ้นนี้จากเว็บไซต์ผู้ผลิตหรือแหล่งข้อมูลที่น่าเชื่อถือบนอินเทอร์เน็ต:\n'
    + 'Serial Number: ' + (serial || 'ไม่ทราบ') + '\n'
    + 'ยี่ห้อ/รุ่น/ชื่ออุปกรณ์: ' + (brand || model || 'ไม่ทราบ') + '\n'
    + 'ตอบกลับเป็น JSON เท่านั้น ห้ามมีคำอธิบายอื่น ห้ามมี Markdown code fence รูปแบบ:\n'
    + '{"warrantyExpiry":"YYYY-MM-DD หรือค่าว่างถ้าไม่พบ","confidence":"high, medium หรือ low","source":"ชื่อเว็บไซต์หรือแหล่งข้อมูลที่พบ หรือค่าว่าง","note":"คำอธิบายสั้นๆ เช่น เหตุผลที่ไม่พบ หรือฐานการคำนวณ"}';

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{role:'user', content: prompt}],
      tools: [{type:'web_search_20250305', name:'web_search'}]
    })
  });
  const data = await response.json();
  const textContent = (data.content || []).filter(c=>c.type==='text').map(c=>c.text).join('\n');
  if(!textContent) throw new Error('ไม่ได้รับข้อความตอบกลับ');
  const clean = textContent.replace(/```json|```/g,'').trim();
  const jsonMatch = clean.match(/\{[\s\S]*\}/);
  return JSON.parse(jsonMatch ? jsonMatch[0] : clean);
}

function wireWarrantyLookup(){
  const btn = document.getElementById('btnLookupWarranty');
  const status = document.getElementById('warrantyLookupStatus');
  if(!btn) return;
  const defaultStatusText = status.textContent;
  btn.onclick = async ()=>{
    const serial = document.getElementById('f_serial').value.trim();
    const model = document.getElementById('f_model').value.trim();
    const name = document.getElementById('f_name').value.trim();
    if(!serial && !model && !name){
      setCaptureStatus(status, 'กรุณากรอก Serial Number, รุ่น หรือชื่ออุปกรณ์ก่อนค้นหา', 'err');
      return;
    }
    setCaptureStatus(status, '<span class="spinner"></span>กำลังค้นหาข้อมูลประกันจากเว็บ...', 'busy');
    try{
      const result = await lookupWarrantyExpiry({serial, model, brand:name});
      if(result.warrantyExpiry){
        document.getElementById('f_warranty').value = result.warrantyExpiry;
        const bits = ['✓ พบข้อมูล (ความเชื่อมั่น: ' + escapeHtml(result.confidence||'ไม่ระบุ') + ')'];
        if(result.source) bits.push('แหล่งที่มา: ' + escapeHtml(result.source));
        bits.push('กรุณาตรวจสอบก่อนบันทึก');
        setCaptureStatus(status, bits.join(' · '), 'ok');
      }else{
        setCaptureStatus(status, 'ไม่พบข้อมูลวันหมดประกันจากการค้นหา กรุณากรอกเอง' + (result.note?(' ('+escapeHtml(result.note)+')'):''), 'err');
      }
    }catch(err){
      setCaptureStatus(status, 'ค้นหาไม่สำเร็จ กรุณาลองใหม่หรือกรอกเอง', 'err');
    }
  };
}

function saveAssetForm(editing){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ showToast('กรุณากรอกชื่ออุปกรณ์'); return; }
  const data = {
    name,
    type: document.getElementById('f_type').value,
    model: document.getElementById('f_model').value.trim(),
    serial: document.getElementById('f_serial').value.trim(),
    location: document.getElementById('f_location').value.trim(),
    purchaseDate: document.getElementById('f_purchase').value,
    warrantyExpiry: document.getElementById('f_warranty').value,
    status: document.getElementById('f_status').value,
    assignee: document.getElementById('f_assignee').value.trim(),
    notes: document.getElementById('f_notes').value.trim(),
    photo: pendingPhotoData || null,
    assetPhoto: pendingAssetPhotoData || null,
  };

  if(editing){
    const prevAssignee = editing.assignee;
    const hadPhotoBefore = editing.photo;
    const hadAssetPhotoBefore = editing.assetPhoto;
    Object.assign(editing, data);
    if(data.assignee && data.assignee !== prevAssignee){
      state.history.unshift({assetId: editing.id, type:'assign', person:data.assignee, date: todayStr(), note:'อัปเดตผู้ใช้งานผ่านการแก้ไขข้อมูล'});
    }
    if(pendingPhotoData && pendingPhotoData !== hadPhotoBefore){
      state.history.unshift({assetId: editing.id, type:'photo', date: todayStr(), note:'อัปเดตข้อมูลจากรูปถ่าย Serial/แผ่นป้าย'});
    }
    if(pendingAssetPhotoData && pendingAssetPhotoData !== hadAssetPhotoBefore){
      state.history.unshift({assetId: editing.id, type:'assetphoto', date: todayStr(), note:'อัปเดตรูปถ่ายทรัพย์สิน'});
    }
    showToast('บันทึกการแก้ไขแล้ว');
  }else{
    const id = uid('IT-' + data.type.slice(0,3).toUpperCase());
    const asset = { id, ...data };
    state.assets.push(asset);
    if(data.assignee){
      state.history.unshift({assetId:id, type:'assign', person:data.assignee, date: todayStr(), note:'มอบหมายเมื่อเพิ่มรายการ'});
    }
    if(pendingPhotoData){
      state.history.unshift({assetId:id, type:'photo', date: todayStr(), note:'เพิ่มรายการพร้อมรูปถ่าย Serial/แผ่นป้าย'});
    }
    if(pendingAssetPhotoData){
      state.history.unshift({assetId:id, type:'assetphoto', date: todayStr(), note:'เพิ่มรายการพร้อมรูปถ่ายทรัพย์สิน'});
    }
    showToast('เพิ่มทรัพย์สินแล้ว');
  }
  pendingPhotoData = null;
  pendingAssetPhotoData = null;
  saveData();
  closeModal();
}

      <div class="detail-row"><span class="k">รุ่น / Model</span><span class="v">${escapeHtml(a.model)||'-'}</span></div>
      <div class="detail-row"><span class="k">Serial Number</span><span class="v mono">${escapeHtml(a.serial)||'-'}</span></div>
      <div class="detail-row"><span class="k">สถานที่ / แผนก</span><span class="v">${escapeHtml(a.location)||'-'}</span></div>
      <div class="detail-row"><span class="k">วันที่ซื้อ</span><span class="v">${fmtDate(a.purchaseDate)}</span></div>
      <div class="detail-row"><span class="k">วันหมดอายุประกัน</span><span class="v" style="color:var(--${w.cls==='warranty-bad'?'coral':w.cls==='warranty-warn'?'amber':'teal'})">${fmtDate(a.warrantyExpiry)} · ${w.text}</span></div>
      <div class="detail-row"><span class="k">ผู้ใช้งานปัจจุบัน</span><span class="v">${escapeHtml(a.assignee)||'ไม่มีผู้ใช้งาน'}</span></div>
      ${a.notes?`<div class="detail-row"><span class="k">หมายเหตุ</span><span class="v">${escapeHtml(a.notes)}</span></div>`:''}

      ${a.photo?`
        <div class="section-title">รูปถ่าย Serial / แผ่นป้าย</div>
        <img src="${a.photo}" class="drawer-photo">
      `:''}

      <div class="action-row">
        ${a.status==='inuse' ? `<button class="btn btn-primary btn-sm" id="btnPrintQR">🏷️ ปริ้น QR Code ติดอุปกรณ์</button>` : ''}
        <button class="btn btn-ghost btn-sm" id="btnAssetPhotoQuick">🖼️ ${a.assetPhoto?'แก้ไขรูปถ่ายทรัพย์สิน':'ใส่รูปถ่ายทรัพย์สิน'}</button>
        <button class="btn btn-ghost btn-sm" id="btnPhotoUpdate">📷 ถ่ายรูป Serial/แผ่นป้ายใหม่</button>
        <button class="btn btn-ghost btn-sm" id="btnEdit">แก้ไขข้อมูล</button>
        <button class="btn btn-ghost btn-sm" id="btnAssign">มอบหมายให้ผู้ใช้</button>
        <button class="btn btn-ghost btn-sm" id="btnReturn">รับคืน / เลิกใช้งาน</button>
        <button class="btn btn-ghost btn-sm" id="btnStatus">เปลี่ยนสถานะ</button>
      </div>

      <div class="section-title">ประวัติการใช้งาน</div>
      ${hist.length===0 ? `<div style="color:var(--ink-soft);font-size:12.5px;">ยังไม่มีประวัติ</div>` :
        hist.map(h=>`
          <div class="history-item">
            <div class="h-title">${h.type==='assign' ? 'มอบหมายให้ ' + escapeHtml(h.person) : h.type==='return' ? 'รับคืนจาก ' + escapeHtml(h.person) : h.type==='photo' ? '📷 อัปเดตข้อมูลจากรูปถ่าย Serial/แผ่นป้าย' : h.type==='assetphoto' ? '🖼️ อัปเดตรูปถ่ายทรัพย์สิน' : 'เปลี่ยนสถานะเป็น ' + (STATUSES[h.status]?STATUSES[h.status].label:h.status)}</div>
            <div class="h-meta">${fmtDate(h.date)}</div>
            ${h.note?`<div class="h-note">${escapeHtml(h.note)}</div>`:''}
          </div>
        `).join('')
      }
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) closeDrawer(); };
  document.getElementById('drawerCloseBtn').onclick = closeDrawer;
  document.getElementById('btnEdit').onclick = ()=>{ closeDrawer(); openAssetModal(a.id); };
  document.getElementById('btnPhotoUpdate').onclick = ()=> openAssetModal(a.id, true);
  document.getElementById('btnAssetPhotoQuick').onclick = ()=> quickAssetPhotoUpdate(a);
  const btnPrintQR = document.getElementById('btnPrintQR');
  if(btnPrintQR) btnPrintQR.onclick = ()=> printAssetQRLabel(a);
  document.getElementById('btnAssign').onclick = ()=> promptAssign(a);
  document.getElementById('btnReturn').onclick = ()=> promptReturn(a);
  document.getElementById('btnStatus').onclick = ()=> promptStatus(a);
}

function quickAssetPhotoUpdate(asset){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = async (e)=>{
    const file = e.target.files[0];
    document.body.removeChild(input);
    if(!file) return;
    showToast('กำลังบันทึกรูปภาพ...');
    try{
      const dataUrl = await fileToCompressedBase64(file, 1200, 0.8);
      asset.assetPhoto = dataUrl;
      state.history.unshift({assetId: asset.id, type:'assetphoto', date: todayStr(), note:'อัปเดตรูปถ่ายทรัพย์สินจากหน้ารายละเอียด'});
      await saveData();
      render();
      showToast('บันทึกรูปถ่ายทรัพย์สินแล้ว');
    }catch(err){
      showToast('บันทึกรูปไม่สำเร็จ ลองอีกครั้ง');
    }
  };
  input.click();
}

function promptAssign(a){
  const datalistId = 'assignUserList';
  showDialog({
    title: 'มอบหมายทรัพย์สิน',
    message: `เลือกหรือพิมพ์ชื่อผู้รับผิดชอบ "${a.name}"`,
    fields: [
      {id:'person', label:'ชื่อผู้ใช้งาน', type:'text', value:a.assignee||'', placeholder:'พิมพ์หรือเลือกจากรายชื่อ', list: state.users.length?datalistId:undefined}
    ],
    datalists: state.users.length ? [{id:datalistId, options: state.users.map(u=>u.name)}] : [],
    confirmText: 'มอบหมาย',
    onConfirm: (values)=>{
      const person = (values.person||'').trim();
      if(!person){ showToast('กรุณากรอกชื่อผู้ใช้งาน'); return; }
      a.assignee = person;
      a.status = 'inuse';
      state.history.unshift({assetId:a.id, type:'assign', person, date: todayStr()});
      saveData();
      render();
      showToast('มอบหมายทรัพย์สินแล้ว');
    }
  });
}

function promptReturn(a){
  if(!a.assignee){ showToast('ทรัพย์สินนี้ไม่มีผู้ใช้งานอยู่'); return; }
  const prevAssignee = a.assignee;
  showConfirmDialog('รับคืนทรัพย์สิน', `รับคืนทรัพย์สินจาก "${prevAssignee}" และเปลี่ยนสถานะเป็นพร้อมใช้งาน?`, ()=>{
    a.assignee = '';
    a.status = 'available';
    state.history.unshift({assetId:a.id, type:'return', person:prevAssignee, date: todayStr()});
    saveData();
    render();
    showToast('รับคืนทรัพย์สินแล้ว');
  }, 'รับคืน');
}

function promptStatus(a){
  showDialog({
    title: 'เปลี่ยนสถานะทรัพย์สิน',
    fields: [
      {id:'status', label:'สถานะใหม่', type:'select', value:a.status, options: Object.entries(STATUSES).map(([k,v])=>({value:k, label:v.label}))}
    ],
    confirmText: 'เปลี่ยนสถานะ',
    onConfirm: (values)=>{
      a.status = values.status;
      state.history.unshift({assetId:a.id, type:'status', status:values.status, date: todayStr()});
      saveData();
      render();
      showToast('เปลี่ยนสถานะแล้ว');
    }
  });
}

/* ---------- Manage Users ---------- */
function openUsersModal(){
  ui.modal = 'users';
  render();
}
function closeUsersModal(){
  ui.modal = null;
  render();
}

function renderUsersModal(){
  let host = document.getElementById('usersModalHost');
  if(host) host.remove();
  if(ui.modal !== 'users') return;

  const wrap = document.createElement('div');
  wrap.id = 'usersModalHost';
  wrap.className = 'overlay';
  wrap.innerHTML = `
    <div class="modal" style="max-width:480px;">
      <h2>จัดการผู้ใช้งาน</h2>
      <div class="modal-sub">รายชื่อผู้ใช้งานที่จะปรากฏให้เลือกเวลามอบหมายทรัพย์สิน</div>
      <div id="usersList" style="max-height:340px;overflow-y:auto;margin:14px 0;">
        ${state.users.length===0 ? `<div style="color:var(--ink-soft);font-size:13px;padding:14px 0;text-align:center;">ยังไม่มีผู้ใช้งานในระบบ กด "+ เพิ่มผู้ใช้งาน" เพื่อเริ่มต้น</div>` :
          state.users.map(u=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);">
              <div>
                <div style="font-weight:500;font-size:13.5px;">${escapeHtml(u.name)}</div>
                ${u.eid?`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">EID: ${escapeHtml(u.eid)}</div>`:''}
                ${u.position?`<div style="font-size:12px;color:var(--ink-soft);">${escapeHtml(u.position)}</div>`:''}
                ${u.department?`<div style="font-size:12px;color:var(--ink-soft);">${escapeHtml(u.department)}</div>`:''}
              </div>
              <div style="display:flex;gap:6px;flex-shrink:0;">
                <button class="btn btn-ghost btn-sm" data-edit-user="${u.id}">แก้ไข</button>
                <button class="btn btn-danger btn-sm" data-del-user="${u.id}">ลบ</button>
              </div>
            </div>
          `).join('')
        }
      </div>
      <div class="modal-actions" style="justify-content:space-between;">
        <button class="btn btn-ghost" id="usersCloseBtn">ปิด</button>
        <button class="btn btn-primary" id="btnAddUser">+ เพิ่มผู้ใช้งาน</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.onclick = (e)=>{ if(e.target===wrap) closeUsersModal(); };
  document.getElementById('usersCloseBtn').onclick = closeUsersModal;
  document.getElementById('btnAddUser').onclick = ()=> openUserFormDialog(null);
  wrap.querySelectorAll('[data-edit-user]').forEach(btn=>{
    btn.onclick = ()=> openUserFormDialog(btn.getAttribute('data-edit-user'));
  });
  wrap.querySelectorAll('[data-del-user]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-del-user');
      const u = state.users.find(x=>x.id===id);
      showConfirmDialog('ลบผู้ใช้งาน', `ยืนยันการลบ "${u?u.name:''}" ออกจากรายชื่อ? (ทรัพย์สินที่เคยมอบหมายไว้จะยังคงเก็บชื่อไว้ในประวัติเหมือนเดิม)`, ()=>{
        state.users = state.users.filter(x=>x.id!==id);
        saveData();
        render();
        showToast('ลบผู้ใช้งานแล้ว');
      }, 'ลบ');
    };
  });
}

function openUserFormDialog(userId){
  const editing = userId ? state.users.find(u=>u.id===userId) : null;
  showDialog({
    title: editing ? 'แก้ไขผู้ใช้งาน' : 'เพิ่มผู้ใช้งานใหม่',
    fields: [
      {id:'name', label:'ชื่อ-นามสกุล', type:'text', value: editing?editing.name:'', placeholder:'ชื่อ-นามสกุล'},
      {id:'eid', label:'EID', type:'text', value: editing?editing.eid:'', placeholder:'เช่น fpiwn776'},
      {id:'position', label:'ตำแหน่ง', type:'text', value: editing?editing.position:'', placeholder:'เช่น IT Admin'},
      {id:'department', label:'แผนก', type:'select', value: editing?editing.department:'', options: departmentOptions(editing?editing.department:'')}
    ],
    confirmText: editing ? 'บันทึก' : 'เพิ่ม',
    onConfirm: (values)=>{
      const name = (values.name||'').trim();
      if(!name){ showToast('กรุณากรอกชื่อผู้ใช้งาน'); return; }
      if(editing){
        editing.name = name;
        editing.eid = (values.eid||'').trim();
        editing.position = (values.position||'').trim();
        editing.department = (values.department||'').trim();
        showToast('บันทึกข้อมูลผู้ใช้งานแล้ว');
      }else{
        state.users.push({id: uid('USR'), name, eid: (values.eid||'').trim(), position: (values.position||'').trim(), department: (values.department||'').trim()});
        showToast('เพิ่มผู้ใช้งานแล้ว');
      }
      saveData();
      render();
    }
  });
}

/* ---------- QR Code label for in-use assets ---------- */
function printAssetQRLabel(asset){
  const ty = getTypeInfo(asset.type);
  const labelLines = [
    'IT ASSET',
    'รหัส: ' + asset.id,
    'ชื่อ: ' + asset.name,
    'ประเภท: ' + ty.label,
    'Serial: ' + (asset.serial || '-'),
    'สถานที่: ' + (asset.location || '-')
  ];
  const qrText = labelLines.join('\n');

  let qrSvg = '';
  try{
    const qr = qrcode(0, 'M');
    qr.addData(qrText);
    qr.make();
    qrSvg = qr.createSvgTag(5, 8);
  }catch(e){
    qrSvg = '<div style="padding:20px;color:#C23B3B;font-size:12px;">ไม่สามารถสร้าง QR Code ได้</div>';
  }

  const win = window.open('', '_blank', 'width=380,height=520');
  if(!win){ showToast('เบราว์เซอร์บล็อกหน้าต่างป๊อปอัป กรุณาอนุญาตแล้วลองใหม่'); return; }
  const parts = [
    '<!DOCTYPE html>',
    '<html><head><meta charset="UTF-8"><title>QR Label - ' + escapeHtml(asset.id) + '</title>',
    '<style>',
    "body{font-family:'IBM Plex Sans Thai', Tahoma, sans-serif;text-align:center;padding:24px 16px;color:#1B2430;}",
    'h3{margin:4px 0;font-size:16px;}',
    '.meta{font-size:12px;color:#5B6572;margin:2px 0;}',
    '#qr{margin:16px auto;display:flex;justify-content:center;}',
    '#qr svg{width:170px;height:170px;}',
    '.label-box{border:1px dashed #999;border-radius:10px;padding:16px;display:inline-block;}',
    'button{margin-top:18px;font-family:inherit;font-size:13px;padding:8px 16px;border-radius:7px;border:1px solid #3E5C76;background:#3E5C76;color:#fff;cursor:pointer;}',
    '@media print{ button{display:none;} }',
    '</style>',
    '</head><body>',
    '<div class="label-box">',
    '<h3>' + escapeHtml(asset.name) + '</h3>',
    '<div class="meta">' + escapeHtml(asset.id) + '</div>',
    '<div id="qr">' + qrSvg + '</div>',
    '<div class="meta">Serial: ' + escapeHtml(asset.serial||'-') + '</div>',
    '<div class="meta">' + escapeHtml(ty.label) + ' · ' + escapeHtml(asset.location||'-') + '</div>',
    '</div>',
    '<div><button onclick="window.print()">พิมพ์ป้าย</button></div>',
    '</body></html>'
  ];
  win.document.write(parts.join('\n'));
  win.document.close();
}

/* ---------- Backup / restore (important for real-world use, especially
   when running as a local file with localStorage-only persistence) ---------- */
function exportBackup(){
  const payload = {
    exportedAt: new Date().toISOString(),
    assets: state.assets,
    history: state.history,
    users: state.users,
    customTypes: state.customTypes
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'it-assets-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('ดาวน์โหลดไฟล์สำรองข้อมูลแล้ว');
}

function importBackupFile(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = (e)=>{
    const file = e.target.files[0];
    document.body.removeChild(input);
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let parsed;
      try{
        parsed = JSON.parse(reader.result);
      }catch(err){
        showToast('ไฟล์ไม่ถูกต้อง ไม่สามารถนำเข้าได้');
        return;
      }
      showConfirmDialog(
        'นำเข้าข้อมูลสำรอง',
        'การนำเข้าจะแทนที่ข้อมูลทั้งหมดที่มีอยู่ตอนนี้ในเครื่องนี้ด้วยข้อมูลจากไฟล์สำรอง ยืนยันหรือไม่?',
        async ()=>{
          state = {
            assets: parsed.assets || [],
            history: parsed.history || [],
            users: parsed.users || [],
            customTypes: parsed.customTypes || {}
          };
          await saveData();
          render();
          showToast('นำเข้าข้อมูลสำเร็จ');
        },
        'นำเข้าข้อมูล'
      );
    };
    reader.readAsText(file);
  };
  input.click();
}

loadData();
